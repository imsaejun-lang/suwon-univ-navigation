<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수원대학교 전 건물 도식화 실내지도 뷰어 &amp; 상호작용 데모</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      height: 100vh;
      display: grid;
      grid-template-columns: 350px 1fr;
      overflow: hidden;
    }
    aside {
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
      gap: 14px;
    }
    h1 { font-size: 16px; font-weight: 800; color: #08386b; }
    .sub { font-size: 12px; color: #64748b; margin-top: 2px; }
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card h2 { font-size: 12.5px; font-weight: 700; color: #334155; }
    select, input, button {
      font-family: inherit;
      font-size: 12.5px;
      border-radius: 7px;
      border: 1px solid #cbd5e1;
      padding: 7px 10px;
      background: #ffffff;
      color: #0f172a;
    }
    button {
      cursor: pointer;
      font-weight: 600;
      transition: background .15s, border-color .15s;
    }
    button.primary { background: #1d4ed8; color: #ffffff; border-color: #1d4ed8; }
    button.primary:hover { background: #1e40af; }
    button.secondary:hover { background: #e2e8f0; }
    .floor-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .floor-pill {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
    }
    .floor-pill.active { background: #0f172a; color: #ffffff; border-color: #0f172a; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > * { flex: 1; }
    .sector-list {
      max-height: 210px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sector-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      font-size: 12px;
      cursor: pointer;
    }
    .sector-item:hover { background: #eff6ff; border-color: #93c5fd; }
    .badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #334155;
    }
    main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    #map-status { font-size: 13px; font-weight: 700; color: #1e293b; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: #475569; align-items: center; }
    .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid #94a3b8; }
    #canvas-wrap {
      flex: 1;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #svg-host {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 14px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 8px 24px rgba(15,23,42,0.06);
      overflow: hidden;
      padding: 8px;
    }
    .refs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .refs-grid img {
      width: 100%;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }
    #route-log { font-size: 11.5px; color: #0f172a; line-height: 1.5; }
  </style>
</head>
<body>
  <aside>
    <div>
      <h1>수원대학교 실내 도식화 지도</h1>
      <div class="sub">전 건물 CAD 도면 + 블로그 참고자료 기반 독립 섹터 SVG</div>
    </div>

    <div class="card">
      <h2>1. 건물 &amp; 층 선택</h2>
      <select id="bldg-select"></select>
      <div id="floor-pills" class="floor-pills"></div>
      <div id="floor-summary" style="font-size:11.5px;color:#475569;"></div>
    </div>

    <div class="card">
      <h2>2. 복도 전용 경로 찾기</h2>
      <div class="row">
        <select id="start-select"></select>
        <select id="end-select"></select>
      </div>
      <div class="row">
        <select id="mode-select">
          <option value="any">계단 + 엘리베이터</option>
          <option value="stairs">계단 우선</option>
          <option value="elevator">엘리베이터 우선</option>
        </select>
        <button id="btn-route" class="primary">경로 탐색</button>
        <button id="btn-clear" class="secondary">초기화</button>
      </div>
      <div id="route-log">지도의 강의실/공간을 클릭하면 출발→도착 또는 단독 강조가 즉시 동작합니다.</div>
    </div>

    <div class="card">
      <h2>3. 표시 옵션 &amp; 공간 목록</h2>
      <div class="row" style="font-size:12px;">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;">
          <input type="checkbox" id="chk-labels" /> 강의실 호수 항상 표시
        </label>
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;">
          <input type="checkbox" id="chk-graph" /> 복도 그래프 보기
        </label>
      </div>
      <input id="sector-search" placeholder="호수/실명 검색 (예: 308, 교학과, 화장실)" />
      <div id="sector-list" class="sector-list"></div>
    </div>

    <div class="card" id="refs-card" style="display:none;">
      <h2>4. 블로그 층별 참고도</h2>
      <div id="refs-grid" class="refs-grid"></div>
    </div>
  </aside>

  <main>
    <header>
      <div id="map-status">로딩 중...</div>
      <div class="legend">
        <span><i class="sw" style="background:#edf4ff;"></i>빈 강의실</span>
        <span><i class="sw" style="background:#7cb9ff;border-color:#1d4ed8;"></i>선택/경로 지정실</span>
        <span><i class="sw" style="background:#bbf7d0;border-color:#16a34a;"></i>계단</span>
        <span><i class="sw" style="background:#ede9fe;border-color:#7c3aed;"></i>엘리베이터</span>
        <span><i class="sw" style="background:#0369a1;"></i>남자화장실</span>
        <span><i class="sw" style="background:#ec4899;"></i>여자화장실</span>
      </div>
    </header>
    <div id="canvas-wrap">
      <div id="svg-host"></div>
    </div>
  </main>

  <script src="suwonBuildingMap.js"></script>
  <script>
    (function () {
      var catalog = null;
      var curBldgMeta = null;
      var curData = null;
      var curFloor = null;
      var startId = null;
      var endId = null;
      var curRoute = null;

      var bldgSel = document.getElementById('bldg-select');
      var floorPills = document.getElementById('floor-pills');
      var floorSummary = document.getElementById('floor-summary');
      var startSel = document.getElementById('start-select');
      var endSel = document.getElementById('end-select');
      var modeSel = document.getElementById('mode-select');
      var chkLabels = document.getElementById('chk-labels');
      var chkGraph = document.getElementById('chk-graph');
      var searchInp = document.getElementById('sector-search');
      var sectorListEl = document.getElementById('sector-list');
      var statusEl = document.getElementById('map-status');
      var routeLogEl = document.getElementById('route-log');
      var svgHost = document.getElementById('svg-host');
      var refsCard = document.getElementById('refs-card');
      var refsGrid = document.getElementById('refs-grid');

      function populateSectorDropdowns() {
        var secs = SuwonBuildingMap.listSectors(curData, null, { excludeVoids: true });
        var optsHtml = '';
        for (var i = 0; i < secs.length; i++) {
          var s = secs[i];
          if (s.type === 'stairs' || s.type === 'elevator') continue;
          var label = '[' + s.floor + '] ' + (s.name || s.roomNumber || s.id);
          optsHtml += '<option value="' + s.id + '">' + label + '</option>';
        }
        startSel.innerHTML = '<option value="">출발지 선택...</option>' + optsHtml;
        endSel.innerHTML = '<option value="">도착지 선택...</option>' + optsHtml;
        if (startId) startSel.value = startId;
        if (endId) endSel.value = endId;
      }

      function renderSectorList() {
        var q = searchInp.value.trim().toLowerCase();
        var secs = SuwonBuildingMap.listSectors(curData, curFloor, { excludeVoids: true });
        sectorListEl.innerHTML = '';
        for (var i = 0; i < secs.length; i++) {
          var s = secs[i];
          var txt = (s.roomNumber || '') + ' ' + (s.name || '') + ' ' + s.type;
          if (q && txt.toLowerCase().indexOf(q) === -1) continue;
          var div = document.createElement('div');
          div.className = 'sector-item';
          div.innerHTML = '<span>' + (s.name || s.id) + '</span><span class="badge">' + s.type + '</span>';
          (function (sec) {
            div.addEventListener('click', function () { handleSectorPick(sec); });
          })(s);
          sectorListEl.appendChild(div);
        }
      }

      function renderFloor() {
        if (!curData || !curFloor) return;
        var fl = SuwonBuildingMap.getFloor(curData, curFloor);
        floorSummary.textContent = fl ? (fl.summary || fl.label || curFloor) : '';
        var pills = floorPills.querySelectorAll('.floor-pill');
        for (var i = 0; i < pills.length; i++) {
          pills[i].classList.toggle('active', pills[i].getAttribute('data-floor') === curFloor);
        }
        statusEl.textContent = curData.name + ' · ' + curFloor + ' (섹터 ' + (fl ? fl.sectors.length : 0) + '개)';

        SuwonBuildingMap.render(svgHost, curData, curFloor, {
          startSectorId: startId,
          endSectorId: endId,
          showRoomLabels: chkLabels.checked,
          showCorridorGraph: chkGraph.checked,
          route: curRoute,
          onSectorClick: function (sec) { handleSectorPick(sec); },
        });
        renderSectorList();
      }

      function handleSectorPick(sec) {
        if (!sec || sec.type === 'void') return;
        if (!startId || (startId && endId)) {
          startId = sec.id;
          endId = null;
          curRoute = null;
          routeLogEl.textContent = '출발 선택됨: [' + sec.floor + '] ' + sec.name + ' — 도착지를 클릭하세요.';
        } else {
          endId = sec.id;
          runRoute();
        }
        startSel.value = startId || '';
        endSel.value = endId || '';
        renderFloor();
      }

      function runRoute() {
        startId = startSel.value || startId;
        endId = endSel.value || endId;
        if (!startId || !endId) return;
        curRoute = SuwonBuildingMap.findCorridorRoute(curData, startId, endId, { mode: modeSel.value });
        if (!curRoute.ok) {
          routeLogEl.textContent = '경로 탐색 실패: ' + curRoute.error;
        } else {
          var stepTxt = curRoute.steps.length ? ' · 이동: ' + curRoute.steps.map(function (st) { return st.label; }).join(', ') : '';
          routeLogEl.textContent = curRoute.start.name + ' → ' + curRoute.end.name + ' (거리 ' + curRoute.totalDistance + stepTxt + ')';
        }
        renderFloor();
      }

      function selectBuilding(bId) {
        for (var i = 0; i < catalog.buildings.length; i++) {
          if (catalog.buildings[i].id === bId) curBldgMeta = catalog.buildings[i];
        }
        SuwonBuildingMap.loadBuilding(bId, '.').then(function (data) {
          curData = data;
          startId = null; endId = null; curRoute = null;
          routeLogEl.textContent = '건물이 로드되었습니다. 공간을 클릭해 색칠 및 경로를 확인하세요.';
          var fids = SuwonBuildingMap.getFloorIds(data);
          curFloor = fids.indexOf('1F') !== -1 ? '1F' : fids[0];
          floorPills.innerHTML = '';
          for (var j = 0; j < fids.length; j++) {
            var btn = document.createElement('button');
            btn.className = 'floor-pill';
            btn.setAttribute('data-floor', fids[j]);
            btn.textContent = fids[j];
            (function (fid) {
              btn.addEventListener('click', function () { curFloor = fid; renderFloor(); });
            })(fids[j]);
            floorPills.appendChild(btn);
          }

          var imgs = (data.references || []).filter(function (r) { return !r.endsWith('.txt'); });
          if (imgs.length) {
            refsCard.style.display = 'flex';
            refsGrid.innerHTML = '';
            imgs.forEach(function (rpath) {
              var im = document.createElement('img');
              im.src = curBldgMeta.dir + '/' + rpath;
              im.title = rpath;
              im.addEventListener('click', function () { window.open(im.src, '_blank'); });
              refsGrid.appendChild(im);
            });
          } else {
            refsCard.style.display = 'none';
          }

          populateSectorDropdowns();
          renderFloor();
        });
      }

      bldgSel.addEventListener('change', function () { selectBuilding(bldgSel.value); });
      chkLabels.addEventListener('change', renderFloor);
      chkGraph.addEventListener('change', renderFloor);
      searchInp.addEventListener('input', renderSectorList);
      document.getElementById('btn-route').addEventListener('click', runRoute);
      document.getElementById('btn-clear').addEventListener('click', function () {
        startId = null; endId = null; curRoute = null;
        startSel.value = ''; endSel.value = '';
        routeLogEl.textContent = '선택이 초기화되었습니다.';
        renderFloor();
      });

      SuwonBuildingMap.loadCatalog('.').then(function (cat) {
        catalog = cat;
        bldgSel.innerHTML = cat.buildings.map(function (b) {
          return '<option value="' + b.id + '">' + b.dir.slice(0, 2) + '. ' + b.name + ' (' + b.floorOrder.length + '개층)</option>';
        }).join('');
        var def = cat.buildings.some(function (b) { return b.id === 'it_college'; }) ? 'it_college' : cat.buildings[0].id;
        bldgSel.value = def;
        selectBuilding(def);
      });
    })();
  </script>
</body>
</html>
